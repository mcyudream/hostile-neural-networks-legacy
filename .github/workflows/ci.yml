name: Legacy build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Prepare pinned source dependencies
        run: python3 tools/bootstrap_legacy.py
      - name: Build and test complete source set, then reobfuscate
        run: bash gradlew --no-daemon :build :reobfJar --console=plain
      - name: Verify packaged loader identity
        run: python3 tools/verify_legacy_package.py
      - name: Require runtime-accepted package for release tags
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 tools/verify_legacy_package.py --require-verified-hash --tag "$GITHUB_REF_NAME"
      - name: Prepare release assets and checksums
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            python3 tools/prepare_release.py --tag "$GITHUB_REF_NAME"
          else
            python3 tools/prepare_release.py
          fi
          cat build/release/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          if-no-files-found: error
          path: build/release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-reports
          if-no-files-found: warn
          path: build/reports/tests/
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist
      - name: Verify downloaded assets
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          release_flags=()
          case "$GITHUB_REF_NAME" in
            *alpha*|*beta*|*rc*) release_flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/*.jar dist/SHA256SUMS \
            --verify-tag --title "Hostile Neural Networks Legacy ${GITHUB_REF_NAME#v}" \
            --notes-file dist/RELEASE-NOTES.md "${release_flags[@]}"
